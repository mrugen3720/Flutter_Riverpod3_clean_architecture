include: package:flutter_lints/flutter.yaml

analyzer:
  # `custom_lint` plugin will be re-enabled once `riverpod_lint` ships a
  # build that supports analyzer 8.x (currently incompatible with the
  # `build_runner ^2.15` toolchain used in this project).
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/gen/**"
  errors:
    # Treat unused_imports and unawaited_futures as errors so CI catches them.
    unused_import: error
    unawaited_futures: error
    avoid_print: error

linter:
  rules:
    # Riverpod / async hygiene
    unawaited_futures: true
    avoid_print: true
    require_trailing_commas: true

    # Style consistency
    prefer_single_quotes: true
    prefer_relative_imports: true
    sort_pub_dependencies: false

    # Defensive coding
    use_build_context_synchronously: true
    avoid_dynamic_calls: true
