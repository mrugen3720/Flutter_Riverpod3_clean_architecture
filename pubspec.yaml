name: flutter_riverpod_clean_architecture
description: "A production-ready Flutter boilerplate with Riverpod 3.x and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # ── Riverpod ──
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # ── Networking ──
  dio: ^5.9.2
  retrofit: ^4.7.1
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1

  # ── Navigation ──
  go_router: ^17.2.3

  # ── Local Storage ──
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2

  # ── Crypto (cert pinning) ──
  crypto: ^3.0.5

  # ── Utilities ──
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  intl: ^0.20.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  http: ^1.3.0
  path: ^1.9.1
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # NOTE: `riverpod_lint` + `custom_lint` are intentionally absent.
  # Their analyzer pin (7.x) currently conflicts with `build_runner ^2.15` (analyzer 8.x).
  # Re-enable when both upstream packages publish analyzer-8-compatible releases:
  #   custom_lint: ^0.7.5
  #   riverpod_lint: ^3.1.3

  # ── Code Generation ──
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  retrofit_generator: ^10.0.0

flutter:
  uses-material-design: true

